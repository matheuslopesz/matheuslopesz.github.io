{% comment %} Links hreflang entre as versões pt-BR e en de um post. {% endcomment %}
{% include translation.html %}
{% if translation %}
  <link rel="alternate" hreflang="{{ page.lang | default: site.lang }}" href="{{ page.url | absolute_url }}">
  <link rel="alternate" hreflang="{{ translation.lang | default: site.lang }}" href="{{ translation.url | absolute_url }}">
{% endif %}
